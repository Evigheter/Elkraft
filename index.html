<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schaktbredd Calc+</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h2>Schaktbredd Calc+</h2>

  <div class="mode-box">
    <strong>Beräkningsläge:</strong><br>
    <div class="mode-options">
      <label class="mode-option">
        <input type="radio" name="berakningslage" value="fri" checked>
        <span>
          <strong>Fri kabel/rör-ordning</strong>
          <small>Dra och släpp objekten i exakt ordning.</small>
        </span>
      </label>

      <label class="mode-option">
        <input type="radio" name="berakningslage" value="standard">
        <span>
          <strong>Standard</strong>
          <small>Sorterar objekten automatiskt efter standardlogik.</small>
        </span>
      </label>
    </div>
    <div class="hint">Programmet startar nu i fri ordning.</div>
  </div>

  <div class="top-controls">
    <div class="tool-card">
      <label class="block">Typ:</label>
      <label class="pill-radio"><input type="radio" name="typ" value="ror" checked> Rör</label>
      <label class="pill-radio"><input type="radio" name="typ" value="kabel"> Kabel</label>
    </div>

    <div class="inline-group tool-card">
      <div>
        <label class="block">Välj standard:</label>
        <select id="standardValjare"></select>
      </div>

      <div id="kabelFargTopWrap" style="display:none;">
        <label class="block">Färg:</label>
        <select id="kabelFargTop"></select>
      </div>

      <div>
        <label class="block">Diameter (mm):</label>
        <input type="number" id="diameter" value="110" style="width:110px">
      </div>

      <div>
        <label class="block">Antal:</label>
        <input type="number" id="antal" value="1" min="1" style="width:90px">
      </div>
    </div>

    <div class="action-row tool-card">
      <button onclick="laggTill()">+ Lägg till</button>
      <button class="danger-btn" onclick="rensa()">Rensa alla</button>
      <button class="secondary-btn" onclick="toggleSidoutrymme()" id="sidoutrymmeBtn" type="button">Sidoutrymme: På</button>
      <label class="switch-label" title="När den är av räknas endast rör/kabel och mellanrum.">
        <input type="checkbox" id="sidoutrymmeToggle" checked onchange="uppdateraSidoutrymmeText(); uppdatera();">
        0,1 m på varje sida
      </label>
      <span class="count-badge badge-black">Antal totalt: <span id="antalTotalt">0</span></span>
      <span class="count-badge badge-red">Total bredd: <span id="resultBadge">0.000 m ~ 0.0 m</span></span>
      <span class="count-badge badge-orange">ELLEVIO SCHAKTTABELL: <span id="schaktTabell">-</span></span>
    </div>
  </div>

  <div id="lista" class="drag-list"></div>

  <p class="result-line"><strong>Total bredd:</strong> <span id="result">0.000 m ~ 0.0 m</span></p>

  <div class="calc">
    <strong>Detaljer:</strong>
    <div id="utrakning"></div>

    <div class="calc-simple">
      <strong>Uträkning:</strong><br>
      <div id="utrakningSimple"></div>
    </div>
  </div>

  <div class="visual-box">
    <div class="visual-header">
      <div class="visual-title-wrap">
        <div class="visual-title">Illustration</div>
        <div id="sideSpaceNotice" class="side-space-notice" style="display:none;">Sidoutrymme ej räknat med</div>
      </div>
      <button onclick="exportPNG()">Exportera PNG</button>
    </div>

    <div class="canvas-wrap">
      <svg id="schaktSvg" width="900" height="700"></svg>
    </div>

    <div class="legend">
      <span><i class="legend-dot legend-ror"></i> Rör</span>
      <span><i class="legend-dot legend-kabel"></i> Kabel / OPTO</span>
    </div>

    <div class="info-row" id="scaleInfo" style="display:none;"></div>
  </div>

  <footer>© Elias Yalikun, 2026.</footer>
</div>

<!-- <div class="badge">Powered by Elias Yalikun</div> -->

<script src="script.js"></script>
</body>
</html>
