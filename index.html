<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schaktbredd PRO+</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h2>Schaktbredd PRO+</h2>

  <div class="mode-box">
    <strong>Beräkningsläge:</strong><br>
    <label><input type="radio" name="berakningslage" value="standard" checked> Standard</label><br>
    <label><input type="radio" name="berakningslage" value="fri"> Fri kabel/rör-ordning</label>
    <div class="hint">I fri ordning kan du dra och släppa objekten i listan.</div>
  </div>

  <div class="top-controls">
    <div>
      <label class="block">Typ:</label>
      <input type="radio" name="typ" value="ror" checked> Rör
      <input type="radio" name="typ" value="kabel"> Kabel
    </div>

    <div class="inline-group">
      <div>
        <label class="block">Välj standard:</label>
        <select id="standardValjare"></select>
      </div>

      <div id="kabelFargTopWrap" style="display:none;">
        <label class="block">Färg:</label>
        <select id="kabelFargTop"></select>
      </div>

      <div>
        <label class="block">Diameter (mm):</label>
        <input type="number" id="diameter" value="110" style="width:110px">
      </div>

      <div>
        <label class="block">Antal:</label>
        <input type="number" id="antal" value="1" min="1" style="width:90px">
      </div>
    </div>

    <div>
      <button onclick="laggTill()">Lägg till</button>
      <button onclick="rensa()">Rensa alla</button>
      <span class="count-badge badge-black">Antal totalt: <span id="antalTotalt">0</span></span>
      <span class="count-badge badge-red">Total bredd: <span id="resultBadge">0.000 m ~ 0.0 m</span></span>
      <span class="count-badge badge-orange">ELLEVIO SCHAKTTABELL: <span id="schaktTabell">-</span></span>
    </div>
  </div>

  <div id="lista" class="drag-list"></div>

  <p><strong>Total bredd:</strong> <span id="result">0.000 m ~ 0.0 m</span></p>

  <div class="calc">
    <strong>Detaljer:</strong>
    <div id="utrakning"></div>

    <div class="calc-simple">
      <strong>Uträkning:</strong><br>
      <div id="utrakningSimple"></div>
    </div>
  </div>

  <div class="visual-box">
    <div class="visual-header">
      <div class="visual-title">Illustration</div>
      <button onclick="exportPNG()">Exportera PNG</button>
    </div>

    <div class="canvas-wrap">
      <svg id="schaktSvg" width="900" height="650"></svg>
    </div>

    <div class="legend">
      <span><i class="legend-dot legend-ror"></i> Rör</span>
      <span><i class="legend-dot legend-kabel"></i> Kabel / OPTO</span>
    </div>

    <div class="info-row" id="scaleInfo"></div>
  </div>

  <footer>© Elias Yalikun, 2026</footer>
</div>

<div class="badge">Powered by Elias Yalikun</div>

<script src="script.js"></script>
</body>
</html>
